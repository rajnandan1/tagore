{% extends "base.html" %}

{% block extrahead %}
  {% set og_title = config.site_name %}
  {% if page and page.title and not page.is_homepage %}
    {% set og_title = page.title ~ " - " ~ config.site_name %}
  {% endif %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="{{ config.site_description }}">
  {% if page and page.canonical_url %}
  <meta property="og:url" content="{{ page.canonical_url }}">
  {% endif %}
  <meta property="og:image" content="{{ config.site_url }}logo/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The tagore wordmark above the line: A Claude Code plugin for prose that other people read.">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}
